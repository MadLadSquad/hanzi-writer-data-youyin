name: Update Dependencies
on:
  push:
    branches: [ master ]
  schedule:
    - cron: "0 8 * * *"
jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
      - name: checking out code
        uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          submodules: true
          clean: false
          fetch-depth: 0
          #persist-credentials: false
      - name: "Import bot's GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.ACTION_COMMIT_SING_PRIVATE_KEY }}
          passphrase: ${{ secrets.ACTION_COMMIT_SING_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Extract commit data
        uses: rlespinasse/git-commit-data-action@v1.x
      - name: Update submodules
        id: mod
        run: |
          git config --global user.name "Madman10K"
          git config --global user.email "contact@madladsquad.com"
          git fetch --all
          git checkout auto || git checkout -b auto
          o=$(git submodule update --remote --merge --init --recursive)
          ./ci.sh
          echo "out=${o:0:1}?" >> $GITHUB_OUTPUT
      - name: Commit
        if: "steps.mod.outputs.out != '?'"
        id: commit
        run: |
          (git add . && git commit -m "auto" && git push origin auto && echo "com=+" >> $GITHUB_OUTPUT) || echo "com=?" >> $GITHUB_OUTPUT
      - name: Test
        run: "echo '${{ steps.mod.outputs.out }} ${{ steps.commits.outputs.com }}!'"
      - name: Create PR
        if: "steps.mod.outputs.out != '?' && steps.commit.outputs.com != '?'"
        uses: JasonEtco/create-an-issue@v2 
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_ISSUE_SECRET }}
        with:
          filename: .github/auto-issue-template.md
          update_existing: true
          search_existing: open
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGE_R2_ACCESS_KEY_ID || vars.PACKAGE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          # Newer AWS CLI versions send checksum headers by default that R2 does not fully support
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        # The AWS CLI is preinstalled on GitHub's Ubuntu runners.
        # A dry run is done first so that the sync aborts if it would delete too many files, guarding against wiping
        # the bucket if the generated data is ever unexpectedly empty.
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          SYNC_ARGS=(. s3://youyin-data --delete --exclude ".git/*" --exclude "ThirdParty/*" --no-progress)

          deletes=$(aws s3 sync "${SYNC_ARGS[@]}" --dryrun | grep -c '^(dryrun) delete:' || true)
          echo "Files to delete: ${deletes}"
          if [ "${deletes}" -gt 1000 ]; then
            echo "::error::Refusing to sync, ${deletes} files would be deleted from R2 (limit is 1000)"
            exit 1
          fi

          aws s3 sync "${SYNC_ARGS[@]}" --only-show-errors
